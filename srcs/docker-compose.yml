services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    env_file: .env
    restart: always

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    env_file: .env
    restart: always
    depends_on:
      - mariadb
      - redis

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    env_file: .env
    restart: always

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception_network
    restart: always

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    ports:
      - "21:21"
      - "40000-40010:40000-40010"
    env_file: .env
    restart: always

  adminer:
    build: ./requirements/adminer
    container_name: adminer
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception_network
    restart: always

  static_website:
    build: ./requirements/bonus/static_website
    container_name: static_website
    ports:
      - "8081:8081"
    networks:
      - inception_network
    restart: always

  netdata:
    build: ./requirements/bonus/netdata
    container_name: netdata
    pid: host          
    user: root         
    cap_add:           
      - SYS_PTRACE     
    ports:
      - "19999:19999"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks:
      - inception_network
    restart: always

volumes:
  mariadb_data:
    driver_opts:
      type: none
      device: /home/hicham/data/mariadb
      o: bind

  wordpress_data:
    driver_opts:
      type: none
      device: /home/hicham/data/wordpress
      o: bind

networks:
  inception_network:
    driver: bridge
