
services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    env_file: .env
    restart: always

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    env_file: .env
    restart: always
    depends_on:
      - mariadb
      - redis

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    env_file: .env
    restart: always

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception_network
    restart: always

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    env_file: .env
    restart: always

volumes:
  mariadb_data:
    driver_opts:
      type: none
      device: /home/hicham/data/mariadb
      o: bind

  wordpress_data:
    driver_opts:
      type: none
      device: /home/hicham/data/wordpress
      o: bind

networks:
  inception_network:
    driver: bridge
